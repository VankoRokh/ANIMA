name: ANIMA v0.1 Integrated M4 Approval Gate

on:
  push:
    branches:
      - work/anima-v01-integrated-m4
  workflow_dispatch:

concurrency:
  group: anima-m4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m4-operator-approved-goal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install regression dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: M4 and earlier integrated regressions
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_memory_v1_approval_gate.py \
            tests/test_memory_v1_goal_proposal_gate.py \
            tests/test_m2_external_val_memory.py \
            tests/test_p6_val_port.py \
            tests/test_memory_v1_integrated_decision_gate.py \
            tests/test_memory_v1_integrated_read_gate.py
      - name: M4 isolated six-case two-process approval gate
        run: |
          mkdir -p integration-reports
          python -m scripts.run_memory_v1_approval_gate \
            --report /tmp/anima-m4-ci-${{ matrix.python-version }}.json
          cp /tmp/anima-m4-ci-${{ matrix.python-version }}.json \
            integration-reports/m4-${{ matrix.python-version }}.json
      - name: Full ANIMA regression
        run: python -m pytest -q -p no:cacheprovider
      - name: Documentation and syntax gate
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anima-m4-approval-py${{ matrix.python-version }}
          path: integration-reports/m4-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 14
