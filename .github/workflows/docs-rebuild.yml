name: Проверка перестроенной документации ANIMA

on:
  push:
    branches:
      - work/anima-v01-documentation-rebuild
  pull_request:
    branches:
      - release/v0.1
  workflow_dispatch:

concurrency:
  group: docs-v01-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-validation:
    name: Документация / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Ссылки, якоря, доступность, генерация и синтаксис
        run: bash scripts/check.sh
      - name: Регрессия документации
        run: python -m pytest -q tests/test_documentation.py
      - name: Релизный импорт и целевые smoke-тесты
        run: python -m pytest -q tests/test_release_v01.py tests/test_release_v01_acceptance.py
