name: ANIMA v0.1 — документация и регрессия R-09

on:
  push:
    branches:
      - develop
      - release/v0.1
  pull_request:
    branches:
      - release/v0.1
      - work/anima-v01-documentation-rebuild
      - develop
  workflow_dispatch:

concurrency:
  group: v01-r09-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-validation:
    name: Документация / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Git SHA и чистое рабочее дерево
        run: |
          git rev-parse HEAD
          git status --short --branch
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Ссылки, якоря, доступность, генерация и синтаксис
        run: bash scripts/check.sh
      - name: Регрессия документации
        run: python -m pytest -q tests/test_documentation.py
      - name: Пути рабочего пространства / без моделей
        run: python -m pytest -q tests/test_workspace_paths.py
      - name: R-08 / быстрый diversity probe (целостность, не SLO)
        run: python -m pytest -q tests/test_release_v01_diversity_probe.py
      - name: Релизный импорт и целевые smoke-тесты
        run: python -m pytest -q tests/test_release_v01.py tests/test_release_v01_acceptance.py
      - name: R-09 / полный pytest на каждой версии Python
        run: python -m pytest -q
      - name: Функциональный gate v0.1 / 128 событий (не SLO)
        run: |
          python -m scripts.run_release_v01_gate --events 128 \
            --report "${{ runner.temp }}/anima-v01-release-gate.json"
      - name: R-08 / разнородные события без служебной разметки
        run: |
          python -m scripts.run_release_v01_diversity_probe --events 160 --seed 7 --mode plain \
            --report "${{ runner.temp }}/anima-v01-r08-plain.json"
      - name: R-08 / контроль с общей служебной разметкой
        run: |
          python -m scripts.run_release_v01_diversity_probe --events 160 --seed 7 --mode labeled \
            --report "${{ runner.temp }}/anima-v01-r08-labeled.json"
      - name: Сохранить R-08 исходные JSON обеих нагрузок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anima-v01-r08-diversity-${{ matrix.python-version }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/anima-v01-r08-plain.json
            ${{ runner.temp }}/anima-v01-r08-labeled.json
      - name: Сохранить первичный JSON gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anima-v01-release-gate-${{ matrix.python-version }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/anima-v01-release-gate.json
      - name: Проверить изменения PR на whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^ HEAD
