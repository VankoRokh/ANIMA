name: ANIMA v0.1 Integrated M6-B1 Godot Source Migration Preflight

on:
  push:
    branches:
      - work/anima-v01-integrated-m6b1
  workflow_dispatch:

concurrency:
  group: anima-m6b1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m6b1-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install regression dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: All M0–M6B1 targeted non-Godot gates
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_memory_v1_godot_migration_gate.py \
            tests/test_memory_v1_execution_gate.py \
            tests/test_memory_v1_binding_gate.py \
            tests/test_memory_v1_approval_gate.py \
            tests/test_memory_v1_goal_proposal_gate.py \
            tests/test_m2_external_val_memory.py \
            tests/test_p6_val_port.py \
            tests/test_memory_v1_integrated_decision_gate.py \
            tests/test_memory_v1_integrated_read_gate.py
      - name: Full ANIMA regression
        run: python -m pytest -q -p no:cacheprovider
      - name: Documentation and syntax gate
        run: bash scripts/check.sh

  m6b1-real-godot-472:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install regression dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install official Godot 4.7.2 with pinned ZIP hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m6b1-godot
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/m6b1-godot/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/m6b1-godot/godot.zip' | sha256sum -c -
          unzip -q /tmp/m6b1-godot/godot.zip -d /tmp/m6b1-godot
          chmod +x /tmp/m6b1-godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/m6b1-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Existing native Godot P6 contract gate
        run: |
          /tmp/m6b1-godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path labs/virtual_anima_lab/godot \
            --script res://BridgeP6DoorTest.gd
      - name: Real Godot M6-B1 eight-case preflight — no effects
        run: |
          mkdir -p m6b1-reports
          python -m labs.virtual_anima_lab.python.m6b1_live_gate \
            --godot /tmp/m6b1-godot/Godot_v4.7.2-stable_linux.x86_64 \
            --report /tmp/anima-m6b1-live-ci.json
          cp /tmp/anima-m6b1-live-ci.json m6b1-reports/godot-live-preflight.json
      - name: Upload exact Git SHA and live Godot mapping evidence
        uses: actions/upload-artifact@v4
        with:
          name: anima-m6b1-live-godot-py314
          path: m6b1-reports/godot-live-preflight.json
          if-no-files-found: error
          retention-days: 14
