name: ANIMA Memory EXP-009 Gate

on:
  push:
    branches:
      - experiment/core-memory-information-baseline
  workflow_dispatch:

concurrency:
  group: exp009-memory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  memory-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Test targeted Memory and EXP-009 regression
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_core_p3b_execution.py \
            tests/test_event_processing.py \
            tests/test_event_retrieval.py \
            tests/test_event_retrieval_c3.py \
            tests/test_memory_shadow_encoding.py \
            tests/test_memory_encoding_e2.py \
            tests/test_memory_encoding_e3.py \
            tests/test_exp009_retrieval_abcd.py \
            tests/test_documentation.py \
            tests/test_source_tree.py
      - name: Full regression
        run: python -m pytest -q -p no:cacheprovider
      - name: Documentation and syntax gate
        run: bash scripts/check.sh
      - name: Import Core assembly
        run: python -c "from anima.core.assembly import build_core; print('import OK')"
      - name: Run EXP-009 paired comparison (read-only)
        run: |
          mkdir -p exp009-results
          python -m labs.exp009.c2_retrieval_abcd \
            --report-dir exp009-results --print-summary
      - name: Publish raw EXP-009 JSONL
        uses: actions/upload-artifact@v4
        with:
          name: exp009-abcd-py${{ matrix.python-version }}
          path: exp009-results/retrieval_abcd.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Generate E4 L1 raw traces and independent diagnostic reports
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-results
          python -m labs.exp009.e4_l0_observation --level L1 --suite positive --output e4-results/e4_l1_positive_raw.json
          python -m labs.exp009.e4_l0_observation --level L1 --suite negative --output e4-results/e4_l1_negative_raw.json
          python -m labs.exp009.e4_evaluator --suite positive --trace e4-results/e4_l1_positive_raw.json --output e4-results/e4_positive_evaluation.json --print-summary
          python -m labs.exp009.e4_evaluator --suite negative --trace e4-results/e4_l1_negative_raw.json --output e4-results/e4_negative_evaluation.json --print-summary
      - name: Publish E4 L1 raw traces and independent diagnostic reports
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-l1-independent-diagnostic-py314
          path: e4-results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate E4 L1.1 raw and independent differential reports
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-l11-results
          python -m labs.exp009.e4_l0_observation --level L1.1 --suite positive --output e4-l11-results/e4_l11_positive_raw.json
          python -m labs.exp009.e4_l0_observation --level L1.1 --suite negative --output e4-l11-results/e4_l11_negative_raw.json
          python -m labs.exp009.e4_l11_evaluator --suite positive --trace e4-l11-results/e4_l11_positive_raw.json --output e4-l11-results/e4_l11_positive_evaluation.json --print-summary
          python -m labs.exp009.e4_l11_evaluator --suite negative --trace e4-l11-results/e4_l11_negative_raw.json --output e4-l11-results/e4_l11_negative_evaluation.json --print-summary
          python -m labs.exp009.e4_l11_compare --old e4-results/e4_positive_evaluation.json --new e4-l11-results/e4_l11_positive_evaluation.json --output e4-l11-results/e4_positive_delta.json
          python -m labs.exp009.e4_l11_compare --old e4-results/e4_negative_evaluation.json --new e4-l11-results/e4_l11_negative_evaluation.json --output e4-l11-results/e4_negative_delta.json
      - name: Publish E4 L1.1 raw, evaluation and differential
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-l11-lab-differential-py314
          path: e4-l11-results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Measure visible E4 L1.1 generalization challenge
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-l11-challenge
          python -m labs.exp009.e4_l11_challenge_runner --output e4-l11-challenge/raw.json
          python -m labs.exp009.e4_l11_challenge_evaluator --trace e4-l11-challenge/raw.json --output e4-l11-challenge/assessment.json --print-summary
      - name: Publish visible E4 L1.1 challenge results
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-l11-visible-novel-challenges-py314
          path: e4-l11-challenge/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Observe E4 derived journal simulated transactional recovery
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-journal-results
          python -m labs.exp009.e4_revision_journal_probe --output e4-journal-results/recovery.json
      - name: Publish E4 derived journal simulated recovery trace
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-derived-journal-simulated-recovery-py314
          path: e4-journal-results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate L1.2 on frozen E4 v0 and predeclared open challenge
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-l12-results
          python -m labs.exp009.e4_l12_association --suite positive --output e4-l12-results/positive_raw.json
          python -m labs.exp009.e4_l12_association --suite negative --output e4-l12-results/negative_raw.json
          python -m labs.exp009.e4_l12_evaluator --suite positive --trace e4-l12-results/positive_raw.json --output e4-l12-results/positive_evaluation.json --print-summary
          python -m labs.exp009.e4_l12_evaluator --suite negative --trace e4-l12-results/negative_raw.json --output e4-l12-results/negative_evaluation.json --print-summary
          python -m labs.exp009.e4_l11_compare --old e4-l11-results/e4_l11_positive_evaluation.json --new e4-l12-results/positive_evaluation.json --output e4-l12-results/positive_delta.json
          python -m labs.exp009.e4_l11_compare --old e4-l11-results/e4_l11_negative_evaluation.json --new e4-l12-results/negative_evaluation.json --output e4-l12-results/negative_delta.json
          python -m labs.exp009.e4_l12_challenge_runner --output e4-l12-results/challenge_raw.json
          python -m labs.exp009.e4_l12_challenge_evaluator --trace e4-l12-results/challenge_raw.json --output e4-l12-results/challenge_evaluation.json --print-summary
      - name: Publish raw L1.2 traces, separate evaluations and paired deltas
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-l12-scoped-lab-evaluation-py314
          path: e4-l12-results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Emit E4 L1.2 explicit source-pointer and alias-scope probe
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-l12-source-results
          python -m labs.exp009.e4_l12_source_probe --output e4-l12-source-results/source_binding.json
      - name: Publish E4 L1.2 source-binding raw probe
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-l12-source-binding-probe-py314
          path: e4-l12-source-results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Emit isolated E4 alias lifecycle / targeted-invalidation raw probe
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-alias-lifecycle-results
          python -m labs.exp009.e4_alias_lifecycle_probe --output e4-alias-lifecycle-results/impact_recovery.json
      - name: Publish E4 alias lifecycle raw experiment
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-alias-lifecycle-selective-invalidation-py314
          path: e4-alias-lifecycle-results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: E4 isolated selective-invalidation scale baseline (PC 100/1k/10k)
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p e4-scale-results
          python -m labs.exp009.e4_scale_probe --sizes 100 1000 10000 --repeat 3 --output e4-scale-results/scale.json
          python -c 'import json; d=json.load(open("e4-scale-results/scale.json")); [print("E4_SCALE_PASS", x["size"], "affected", x["samples"][0]["affected"], "median_revoke_s", x["median_revoke_s"], "peak_rss_kib", max(y["peak_rss_kib_linux_process"] for y in x["samples"])) for x in d["runs"]]'
      - name: Publish isolated E4 scale benchmark
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: e4-selective-invalidation-scale-py314
          path: e4-scale-results/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Event Retrieval C3 PC baseline (10k and 100k Events)
        if: github.event_name == 'workflow_dispatch' && matrix.python-version == '3.14'
        run: |
          mkdir -p c3-results
          python -m labs.exp009.event_retrieval_c3 \
            --events 10000 --report-dir c3-results
          python -m labs.exp009.event_retrieval_c3 \
            --events 100000 --report-dir c3-results
      - name: Publish Event Retrieval C3 metrics
        if: github.event_name == 'workflow_dispatch' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: event-retrieval-c3-pc-py314
          path: c3-results/event_retrieval_c3_*.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare Memory Encoding shadow E1
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p encoding-results
          python -m labs.exp009.memory_encoding_shadow \
            --report-dir encoding-results
      - name: Publish E1 raw episode boundary decisions
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: memory-encoding-shadow-e1-py314
          path: encoding-results/memory_encoding_shadow.json
          if-no-files-found: error
          retention-days: 14
      - name: Run weak episode-link E2 experiment
        if: matrix.python-version == '3.14'
        run: |
          python -m labs.exp009.memory_encoding_e2 \
            --report-dir encoding-results
      - name: Publish E2 candidate/raw decisions
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: memory-encoding-e2-py314
          path: encoding-results/memory_encoding_e2_candidates.json
          if-no-files-found: error
          retention-days: 14
      - name: Run E3 weak link review triage
        if: matrix.python-version == '3.14'
        run: |
          python -m labs.exp009.memory_encoding_e3 \
            --report-dir encoding-results
      - name: Publish E3 unverified review decisions
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: memory-encoding-e3-py314
          path: encoding-results/memory_encoding_e3_review.json
          if-no-files-found: error
          retention-days: 14
