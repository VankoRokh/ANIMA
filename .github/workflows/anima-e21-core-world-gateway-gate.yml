name: ANIMA v0.2 E2.1 Core-Owned Read-Only World Gateway

on:
  push:
    branches:
      - work/v02-e21-core-owned-world-gateway
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anima-e21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python ${{ matrix.python-version }} / E2.1 and full regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: E2.1 Core-bound gateway negative and identity tests
        run: python -m pytest -q -p no:cacheprovider tests/test_e21_core_gateway.py
      - name: Prior E1.1–E1.4 contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_lifecycle_world_contracts.py \
            tests/test_lifecycle_scenario.py \
            tests/test_lifecycle_world_verification.py \
            tests/test_lifecycle_world_recovery.py
      - name: Check docs links and Python syntax
        run: bash scripts/check.sh
      - name: Full Python regression
        run: python -m pytest -q -p no:cacheprovider

  godot:
    name: Godot 4.7.2 / E1-min + E2.1 trusted gateway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install verified official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Prior E1.1–E1.4 P5/P6/M2 + E1-min + E2.1 live
        shell: bash
        env:
          E21_REPORT_DIR: ${{ runner.temp }}/anima-e21-evidence
        run: bash scripts/run_e21_live_gate.sh "$GODOT_BIN"
      - name: Preserve raw evidence even if failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anima-e21-read-only-core-gateway
          path: ${{ runner.temp }}/anima-e21-evidence/
          if-no-files-found: warn
          retention-days: 21
