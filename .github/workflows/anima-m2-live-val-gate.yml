name: ANIMA v0.1 Integrated M2 Live VAL Gate

on:
  push:
    branches:
      - work/anima-v01-integrated-m2
  workflow_dispatch:

concurrency:
  group: anima-m2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  m2-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install regression dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: M2 offline and earlier integrated gates
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_m2_external_val_memory.py \
            tests/test_p6_val_port.py \
            tests/test_memory_v1_integrated_decision_gate.py \
            tests/test_memory_v1_integrated_read_gate.py
      - name: Full ANIMA regression
        run: python -m pytest -q -p no:cacheprovider
      - name: Documentation and syntax gate
        run: bash scripts/check.sh

  m2-godot-472-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install regression dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Get exact official Godot 4.7.2 Linux binary and verify digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m2-godot
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/m2-godot/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/m2-godot/godot.zip' | sha256sum -c -
          unzip -q /tmp/m2-godot/godot.zip -d /tmp/m2-godot
          chmod +x /tmp/m2-godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/m2-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Existing P6 native GDScript contract
        run: |
          /tmp/m2-godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path labs/virtual_anima_lab/godot \
            --script res://BridgeP6DoorTest.gd
      - name: M2 real Godot three-case integrated recovery
        run: |
          mkdir -p m2-results
          python -m labs.virtual_anima_lab.python.m2_integrated_gate \
            --godot /tmp/m2-godot/Godot_v4.7.2-stable_linux.x86_64 \
            --report /tmp/anima-m2-live-ci.json
          cp /tmp/anima-m2-live-ci.json m2-results/live-m2.json
      - name: Publish real Godot M2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: anima-m2-live-godot-py314
          path: m2-results/live-m2.json
          if-no-files-found: error
          retention-days: 14
